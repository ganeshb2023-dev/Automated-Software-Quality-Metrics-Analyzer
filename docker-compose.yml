# Spins up a local SonarQube Community Edition server for the
# "SonarQube integration" panel of the web app and for running the
# SonarScanner CLI against the sample_project (or any uploaded project).
#
# Usage:
#   docker-compose up -d
#   open http://localhost:9000   (default login: admin / admin - you will
#   be asked to set a new password on first login)
#
# Then, in SonarQube: My Account > Security > Generate Token, create a
# project with key "asqma-sample", and paste the server URL / token /
# project key into the app's SonarQube panel.

version: "3.8"

services:
  sonarqube:
    image: sonarqube:community
    container_name: asqma-sonarqube
    depends_on:
      - sonar_db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sonar_db:
    image: postgres:15-alpine
    container_name: asqma-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
