# SonarScanner configuration - analyzes this repository (including
# sample_project/) into the local SonarQube server started by
# docker-compose.yml. Run with the SonarScanner CLI:
#
#   sonar-scanner \
#     -Dsonar.host.url=http://localhost:9000 \
#     -Dsonar.token=<your generated token>
#
# NOTE: for SonarCloud, sonar.organization is your ORGANIZATION key and
# sonar.projectKey is the PROJECT key shown on the project's page.
# Change both if yours differ.
#
# See README.md for the full walkthrough.

sonar.organization=asqma-sample
sonar.projectKey=ganeshb2023-dev_Automated-Software-Quality-Metrics-Analyzer
sonar.projectName=Automated-Software-Quality-Metrics-Analyzer
sonar.sources=.
sonar.exclusions=**/tests/**,**/static/**,**/templates/**,**/*.md
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
